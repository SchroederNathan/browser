build:
  name: Exact iOS
  steps:
    - eas/checkout
    - run:
        name: Prepare Exact
        command: sh .ci/prepare-native.sh ios
    - eas/install_node_modules
    - eas/resolve_build_config
    - run:
        name: Archive
        command: |
          set -eu
          bun "$EXACT/scripts/exact.mjs" setup --check --platform ios --device
          export EXACT_BUILD_NUMBER="${ eas.job.version.buildNumber }"
          EAS_CREDENTIALS=$(mktemp -d)
          cat > "$EAS_CREDENTIALS/credentials.json" <<'EXACT_EAS_CREDENTIALS'
          ${ eas.job.secrets.buildCredentials }
          EXACT_EAS_CREDENTIALS
          bun .ci/eas-credentials.mjs "$EAS_CREDENTIALS"
          export CI_IOS_P12="$EAS_CREDENTIALS/dist.p12" EXACT_PROFILE="$EAS_CREDENTIALS/app.mobileprovision"
          CI_IOS_P12_PASSWORD=$(cat "$EAS_CREDENTIALS/p12-password")
          . .ci/sign-ios.sh
          bun exact.mjs ios --device --archive out.ipa --json > artifact.json
    - eas/upload_artifact:
        inputs:
          type: application-archive
          path: out.ipa
